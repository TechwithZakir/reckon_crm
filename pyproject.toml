[project]
name = "reckon_crm"
description = "Field sales extensions for Frappe CRM"
authors = [{ name = "Reckon CRM Contributors" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 100
target-version = "py310"

